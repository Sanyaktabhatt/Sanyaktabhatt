name: Generate Galaga

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Galaga SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "galaga"
          hide_month_labels: "false"

      - name: Push SVGs to output-galaga branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-galaga
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
